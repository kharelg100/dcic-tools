<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equity Tool</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#f4f5f1;--surface:#fff;--surface2:#eceee8;--ink:#171d1b;--muted:#5c6662;--rule:#d8ddd6;--rule2:#c5ccc4;
  --navy:#1f3a5f;--accent:#eb6834;--exist:#00A3E0;--uc:#d9482b;--prop:#E69F00;--red:#8b1a2b;--green:#1e9e6a;--amber:#b07a1a;--blue:#1f6f8b;
  --pink:#f3e6e8;--strip:#fbe3d6;--slider:#7b3fe4;--onnavy:#ffffff;
  --display:"Fraunces",Georgia,serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#151a19;--surface:#1e2523;--surface2:#242c29;--ink:#e9ece7;--muted:#9aa39e;--rule:#2f3835;--rule2:#3c4642;
  --navy:#9db8dc;--accent:#f08a5e;--exist:#4cc3f0;--uc:#e8623f;--prop:#f5b73a;--red:#e07a86;--green:#3cc593;--amber:#e0a53a;--blue:#6fb3cc;--pink:#3a2a2e;--strip:#4a3328;--slider:#a98bff;--onnavy:#151a19}}
:root[data-theme="dark"]{
  --ground:#151a19;--surface:#1e2523;--surface2:#242c29;--ink:#e9ece7;--muted:#9aa39e;--rule:#2f3835;--rule2:#3c4642;
  --navy:#9db8dc;--accent:#f08a5e;--exist:#4cc3f0;--uc:#e8623f;--prop:#f5b73a;--red:#e07a86;--green:#3cc593;--amber:#e0a53a;--blue:#6fb3cc;--pink:#3a2a2e;--strip:#4a3328;--slider:#a98bff;--onnavy:#151a19}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--ground);border-bottom:1px solid var(--rule)}
.bar{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.brand{font-family:var(--display);font-size:19px;font-weight:600}
.brand small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
nav button{font:600 13px var(--body);color:var(--muted);background:none;border:0;padding:6px 9px;border-radius:6px;cursor:pointer}
nav button:hover{color:var(--ink);background:var(--surface2)}
nav button[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--slider);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
section.screen{display:none}section.screen.active{display:block}
.qnum{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-weight:500;font-size:32px;line-height:1.15;margin:4px 0 8px;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0 0 8px}
p{max-width:72ch;margin:0 0 10px}
.lede{color:var(--muted);font-size:17.5px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.controls{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin:0 0 10px;font-size:15px}
.controls label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input[type=range]{accent-color:var(--slider);width:min(220px,55vw)}
select{font:15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--rule2);border-radius:6px;padding:6px 8px;max-width:100%}
.toggle{display:inline-flex;border:1px solid var(--rule2);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.toggle button{font:600 14px var(--body);background:var(--surface);color:var(--muted);border:0;padding:7px 12px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}
.readout{font-family:var(--mono);font-size:15px;background:var(--surface2);padding:4px 9px;border-radius:5px}
.fig{width:100%;height:auto;display:block;overflow:visible}
.fig text{font-family:var(--body);font-size:15px;fill:var(--ink)}
.fig .muted{fill:var(--muted)}
.fig .onnavy{fill:var(--onnavy)}
.fig .small{font-size:13px}
.cap{font-size:14px;color:var(--muted);margin:6px 0 0}
.take{border-left:5px solid var(--navy);background:var(--surface2);border-radius:0 8px 8px 0;padding:12px 16px;margin:12px 0;font-size:17px}
.take b{font-family:var(--display);color:var(--navy);font-weight:500}
.limit{border-left:5px solid var(--red);background:var(--surface2);border-radius:0 8px 8px 0;padding:10px 16px;margin:10px 0;font-size:15px}
.limit b{color:var(--red)}
.basis{display:inline-block;font:600 11px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--rule2);color:var(--muted);vertical-align:middle;margin-left:4px}
.basis.rule{border-color:var(--green);color:var(--green)}.basis.prop{border-color:var(--amber);color:var(--amber)}.basis.rec{border-color:var(--blue);color:var(--blue)}.basis.calc{border-color:var(--rule2);color:var(--muted)}.basis.study{border-color:var(--navy);color:var(--navy)}
details{margin:12px 0 0;font-size:14.5px;color:var(--muted)}
details summary{cursor:pointer;color:var(--ink);font-weight:600;font-size:15px}
details p{max-width:none;margin:8px 0}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.pn button{font:600 15px var(--body);background:var(--surface);color:var(--ink);border:1px solid var(--rule2);border-radius:8px;padding:10px 16px;cursor:pointer}
.pn button:disabled{opacity:.4;cursor:default}
.qlist{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.qlist li button{width:100%;text-align:left;font:17px var(--body);background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;cursor:pointer;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.qlist li button:hover{border-color:var(--navy)}
.qlist .n{font-family:var(--mono);color:var(--accent);font-weight:500}
.qlist .s{color:var(--muted);font-size:14px;margin-left:auto}
.two{display:grid;grid-template-columns:11fr 9fr;gap:18px}
@media (max-width:760px){.two{grid-template-columns:1fr}h1{font-size:26px}.fig text{font-size:24px}.fig .small{font-size:20px}}
.foot{margin-top:32px;padding-top:14px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
.foot a{color:var(--navy)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--rule)}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.map svg{width:100%;height:auto;display:block;background:var(--surface2);border-radius:8px}
.map .rl{font-family:var(--body);font-size:10.5px;fill:var(--ink);paint-order:stroke;stroke:var(--surface2);stroke-width:3px;stroke-linejoin:round}
.map .pl{font-family:var(--body);font-size:10px;fill:#2e7d4f;font-style:italic;paint-order:stroke;stroke:var(--surface2);stroke-width:3px}
.map .ll{font-family:var(--body);font-size:10px;fill:var(--ink);paint-order:stroke;stroke:var(--surface2);stroke-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:6px 0 0}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{display:inline-block;width:18px;height:0;border-top:3px solid #888}.legend i.fw{border-top:4px solid #6b6f73}.legend i.ar{border-top:2px solid #9a9ea2}.legend i.lim{border-top:2px dashed #b0462b}.legend i.band{border-top:2px dashed var(--navy)}.legend b{display:inline-block;width:11px;height:11px;border-radius:50%}.legend b.sch{background:#7b3fe4;border-radius:2px}.legend b.cc{background:#e07b00}.legend b.gw{width:6px;height:6px;background:#777}.legend b.park{background:#bfe3c6;border:1px solid #6fbf87;border-radius:2px}
.kv{display:grid;grid-template-columns:1fr;gap:2px;font-size:15px;margin:8px 0}.kv span{color:var(--muted);font-size:13px}.kv b{font-weight:600;margin-bottom:6px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}.stat div{background:var(--surface2);border-radius:8px;padding:10px 12px}.stat .n{font-family:var(--mono);font-size:24px;font-weight:500}.stat .l{font-size:13px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:10px 0}
.cal div{height:56px;border-radius:5px;background:var(--surface2);position:relative;font-size:11px;color:var(--muted);padding:3px 4px}
.cal div i{position:absolute;left:4px;right:4px;bottom:4px;height:5px;border-radius:2px;background:var(--green)}
.cal div.em i{height:32px;background:var(--red)}
.cal div.off i{display:none}
@media (max-width:760px){.cal{grid-template-columns:repeat(6,1fr)}}
.sr{position:absolute;left:-9999px}
</style>

 s+=`</g>`;
 s+=`<line x1="${pad}" y1="${H-22}" x2="${pad+milePx}" y2="${H-22}" stroke="var(--ink)" stroke-width="2"/><text x="${pad+milePx/2}" y="${H-28}" text-anchor="middle" font-size="12" fill="var(--ink)">1 mile</text>`;
 s+=`<path d="M${W-30},${H-18} l0,-26 l-6,8 M${W-30},${H-44} l6,8" stroke="var(--ink)" stroke-width="1.5" fill="none"/><text x="${W-30}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--ink)">N</text>`;
 s+=`<text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${st.lat.toFixed(3)}° N, ${Math.abs(st.lon).toFixed(3)}° W</text></svg>`;
 const leg=`<div class="legend"><span><i class="fw"></i>freeway</span><span><i></i>major street</span><span><i class="ar"></i>other thoroughfare</span><span><i class="lim"></i>Fort Worth city limit</span>${C.etj&&C.etj.length?'<span><b style="background:#e9d9a8;border-radius:2px"></b>Fort Worth ETJ (no City zoning)</span>':''}${C.other&&C.other.length?'<span><b style="background:#c9ccd1;border-radius:2px"></b>other city or unincorporated</span>':''}<span><i class="band"></i>1-mile band</span><span><b class="park"></b>park</span><span><b class="sch"></b>school</span><span><b class="cc"></b>licensed child care</span>${C.gw.length?'<span><b class="gw"></b>gas well</span>':''}${C.dnl.length?'<span><i style="border-top:2px dotted #1f6f8b"></i>airport 65 DNL</span>':''}</div>`;
 document.getElementById('site-map').innerHTML=s+leg+`<p class="cap">Solid: ${basis}. Dashed navy: one mile from that boundary. Untinted land is inside the Fort Worth city limits; tan is the City's extraterritorial jurisdiction, where it has no zoning authority; grey is another city or unincorporated county. Roads are the City's Master Thoroughfare Plan (2020), so local streets are not shown; parks, city limits, and gas wells are City GIS; schools are TEA 2023 to 2024 campuses; child-care centers are HHSC-licensed centers within the band. Hover a school or center for its name.</p>`;
 const share=st.share80>=99?'nearly all':st.share80===0?'none':st.share80+'%';
 document.getElementById('site-text').innerHTML=`<div class="stat"><div><div class="n">about ${fmt(st.pop)}</div><div class="l">residents within one mile (estimate)</div></div><div><div class="n">${share==='none'?'0%':share}</div><div class="l">of them in tracts at or above the 80th EJI percentile; Fort Worth overall about ${SITE.city_share80}%</div></div></div><div class="kv"><span>Status (${SNAPSHOT})</span><b>${st.status}</b><span>Jurisdiction</span><b>${st.juris}</b></div>`;
 const recs=st.recs.slice().sort((a,b)=>a[1]-b[1]); const head='<p style="margin:10px 0 4px"><b>Selected nearby places identified in the source layers (within one mile)</b></p>';
 const rows=r=>`<table><thead><tr><th>Place</th><th>Distance</th></tr></thead><tbody>${r.map(x=>`<tr><td>${x[0]}</td><td>${x[1].toFixed(2)} mi</td></tr>`).join('')}</tbody></table>`;
 document.getElementById('site-recs').innerHTML= recs.length===0?head+'<p class="cap">None found in the City, TEA, and HHSC layers used.</p>':(recs.length<=5?head+rows(recs):head+rows(recs.slice(0,3))+`<details><summary>Show all ${recs.length}</summary>${rows(recs.slice(3))}</details>`);
 document.getElementById('site-take').innerHTML=`<b>Takeaway.</b> About ${fmt(st.pop)} people live within a mile of ${st.n}, and ${share} of them live in tracts the CDC index ranks in the most burdened fifth nationally, against about ${SITE.city_share80} percent citywide. These estimates describe nearby residents and existing community conditions. They help identify questions for site-specific review; a lower index result does not establish low exposure or justify reducing noise, air, or other applicable assessments.`;
}
// ---- wiring
build();

document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(+g.dataset.go);return}
 const t=e.target.closest('.toggle button');if(t){t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));redraw();}});
document.addEventListener('input',redraw);document.addEventListener('change',redraw);

function redraw(){drawSite();}
redraw();
</script>
</body>
</html>
